name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Android project
        uses: ./.github/actions/setup-android-project

      - name: Parse version from tag
        id: version
        run: |
          set -euo pipefail
          eval "$(./scripts/parse-release-version.sh "$GITHUB_REF_NAME")"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing
        run: ./scripts/prepare-release-signing.sh
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Test and build release APK
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
          -PVERSION_NAME="${{ steps.version.outputs.name }}"
          -PVERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Stage release APK
        id: apk
        run: |
          set -euo pipefail
          release_apk="ClipboardReplacer-${{ steps.version.outputs.name }}-release.apk"
          cp "app/build/outputs/apk/release/ClipboardReplacer-${{ steps.version.outputs.name }}-release.apk" "$release_apk"
          echo "path=$release_apk" >> "$GITHUB_OUTPUT"

      - name: Verify release APK signature
        run: ./scripts/verify-release-apk.sh "${{ steps.apk.outputs.path }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## Install notes

            If you previously installed a **debug** build (for example `v0.1.1`), uninstall it first. Debug and release builds use different signing keys, so Android will not allow an in-place upgrade.

      - name: Remove release keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore"
