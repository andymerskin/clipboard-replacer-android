name: CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/actions/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Android project
        uses: ./.github/actions/setup-android-project

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
