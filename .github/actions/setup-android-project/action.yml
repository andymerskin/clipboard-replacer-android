name: Setup Android project
description: Install JDK 17, Android SDK packages, and Gradle cache for CI.

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: tools platform-tools platforms;android-37.0 build-tools;36.0.0
        accept-android-sdk-licenses: true

    - name: Link API 37 platform directory
      shell: bash
      run: |
        set -euo pipefail
        sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        if [[ -d "$sdk_root/platforms/android-37.0" && ! -e "$sdk_root/platforms/android-37" ]]; then
          ln -sfn android-37.0 "$sdk_root/platforms/android-37"
        fi

    - name: Set up Gradle
      uses: gradle/gradle-build-action@v2
